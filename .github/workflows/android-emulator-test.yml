name: Android gameplay verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 -c "import zipfile; zipfile.ZipFile('comando-updated.zip').extractall('android-src')"
      - run: gradle --no-daemon --project-dir android-src assembleDebug assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: adb install -r android-src/app/build/outputs/apk/debug/app-debug.apk && adb install -r android-src/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk && adb shell am instrument -w -r com.mmsistemastecnologia.comandodecampo.test/androidx.test.runner.AndroidJUnitRunner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-apk-and-test
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
