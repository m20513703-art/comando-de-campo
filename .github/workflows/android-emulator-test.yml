name: Android gameplay verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Grant the hosted runner access to KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null <<'EOF'
            KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
            EOF
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo 'KVM device not available on this runner' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract corrected Android source
        run: python3 -c "import zipfile; zipfile.ZipFile('comando-updated.zip').extractall('android-src')"
      - name: Build debug app and instrumentation APKs
        run: gradle --no-daemon --project-dir android-src assembleDebug assembleDebugAndroidTest
      - name: Run gameplay instrumentation on KVM-accelerated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell 'while [[ "$(getprop sys.boot_completed)" != "1" ]]; do sleep 2; done'
            adb install -r android-src/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-src/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout 300 adb shell am instrument -w -r com.mmsistemastecnologia.comandodecampo.test/androidx.test.runner.AndroidJUnitRunner
      - name: Upload APK and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comando-de-campo-emulator-test
          path: |
            android-src/app/build/outputs/apk/debug/app-debug.apk
            android-src/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
