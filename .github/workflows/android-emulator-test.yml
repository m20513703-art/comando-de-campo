name: Android emulator gameplay test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Patch stale packaged source and add device test
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          zipfile.ZipFile('android-project-updated.zip').extractall('android-src')
          r=pathlib.Path('android-src'); h=r/'app/src/main/assets/index.html'; s=h.read_text()
          s=s.replace("'CONTRATAR · $100'", "'CONTRATAR · GRÁTIS'")
          s=s.replace("if(state.money<100){toast('Saldo insuficiente.');return}state.money-=100;", "")
          s=s.replace("' contratado(s) · moeda demonstrativa: $0'", "' contratado(s) · contratações gratuitas nesta demonstração'")
          h.write_text(s)
          g=r/'app/build.gradle'; t=g.read_text().replace('        versionCode 1',"        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'\n        versionCode 2")
          t += "\ndependencies { androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test:core:1.6.1'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }\n"; g.write_text(t)
          f=r/'app/src/androidTest/java/com/mmsistemastecnologia/comandodecampo/GameplayTest.java'; f.parent.mkdir(parents=True,exist_ok=True)
          f.write_text('''package com.mmsistemastecnologia.comandodecampo;
import android.app.Activity; import android.content.Intent; import android.webkit.WebView; import android.view.View; import android.view.ViewGroup;
import androidx.test.platform.app.InstrumentationRegistry; import androidx.test.ext.junit.runners.AndroidJUnit4; import org.junit.Test; import org.junit.runner.RunWith; import java.util.concurrent.*; import static org.junit.Assert.*;
@RunWith(AndroidJUnit4.class) public class GameplayTest {
 WebView web; String js(String s)throws Exception{CountDownLatch l=new CountDownLatch(1);String[]o={null};InstrumentationRegistry.getInstrumentation().runOnMainSync(()->web.evaluateJavascript(s,v->{o[0]=v;l.countDown();}));assertTrue(l.await(10,TimeUnit.SECONDS));return o[0];}
 WebView find(View v){if(v instanceof WebView)return(WebView)v;if(v instanceof ViewGroup){ViewGroup g=(ViewGroup)v;for(int i=0;i<g.getChildCount();i++){WebView w=find(g.getChildAt(i));if(w!=null)return w;}}return null;}
 @Test public void fullGameplayAndRestartPersistence()throws Exception{
  android.app.Instrumentation i=InstrumentationRegistry.getInstrumentation(); Intent in=new Intent(i.getTargetContext(),MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); Activity a=i.startActivitySync(in); web=find(a.getWindow().getDecorView()); assertNotNull(web);
  for(int n=0;n<40&&!js("document.readyState").contains("complete");n++)Thread.sleep(250);
  assertTrue(js("document.body.innerText.includes('COMANDO DE CAMPO')").contains("true"));
  js("clubName.value='Clube QA';clubName.dispatchEvent(new Event('input',{bubbles:true}));managerName.value='Técnico QA';managerName.dispatchEvent(new Event('input',{bubbles:true}));saveClub.click()"); assertTrue(js("JSON.parse(localStorage.cdcApp).club.name").contains("Clube QA"));
  js("document.querySelector('[data-tab=league]').click();document.querySelectorAll('[data-team]').forEach((e,i)=>{if(i<2)e.click()});makeLeague.click()"); assertTrue(js("JSON.parse(localStorage.cdcApp).league.teams.length").contains("3"));
  js("document.querySelector('[data-tab=squad]').click();document.querySelectorAll('[data-sign]').forEach((e,i)=>{if(i<12)e.click()})"); assertTrue(js("JSON.parse(localStorage.cdcApp).squad.length===12&&JSON.parse(localStorage.cdcApp).lineup.length===11").contains("true"));
  js("Math.random=()=>0;playFirst.click()"); assertTrue(js("matchBox.innerText.includes('INTERVALO')").contains("true")); js("document.querySelector('[data-line=demo12]').click();playSecond.click()");
  assertTrue(js("JSON.parse(localStorage.cdcApp).league.rounds.flat().some(m=>m.homeScore!==null&&m.awayScore!==null)").contains("true")); assertTrue(js("seasonContent.innerText.includes('Clube QA')").contains("true"));
  i.runOnMainSync(()->a.recreate());Thread.sleep(1800);web=find(a.getWindow().getDecorView());assertTrue(js("JSON.parse(localStorage.cdcApp).league.rounds.flat().some(m=>m.homeScore!==null&&m.awayScore!==null)").contains("true")); i.runOnMainSync(()->a.finish());
 }
}''')
          PY
      - run: gradle --no-daemon --project-dir android-src assembleDebug assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r android-src/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-src/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.mmsistemastecnologia.comandodecampo.test/androidx.test.runner.AndroidJUnitRunner
            adb logcat -d > emulator-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-apk-and-logcat
          path: |
            android-src/app/build/outputs/apk/debug/app-debug.apk
            emulator-logcat.txt
          if-no-files-found: warn
