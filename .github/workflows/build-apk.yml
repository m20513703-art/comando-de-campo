name: Build Comando de Campo APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -c "import zipfile; zipfile.ZipFile('android-project.zip').extractall('android-src')"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon --project-dir android-src assembleDebug
      - run: test -s android-src/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: comando-de-campo-apk
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
